name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  test-code:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # Must match the Python version in the Dockerfile base image.
      # The "Check Python version" step fails if they differ.
      PYTHON_VERSION: "3.15"

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read base image from Dockerfile
        run: |
          # Parse the FROM line one time. Accept only a release tag
          # (vX.Y.Z), with an optional @sha256 digest.
          FROM_LINE=$(grep -m1 '^FROM ' Dockerfile || true)
          IMG='ghcr\.io/sage-bionetworks/synapsepythonclient'
          VER='([0-9]+\.[0-9]+\.[0-9]+)'
          DIGEST='(@sha256:[0-9a-f]{64})?'
          RE="^FROM (${IMG}:v${VER}${DIGEST})( |$)"
          if [[ ! "$FROM_LINE" =~ $RE ]]; then
            echo "::error::Could not read a release synapseclient image" \
              "from Dockerfile (got '$FROM_LINE'). Expected a line like" \
              "'FROM ghcr.io/sage-bionetworks/synapsepythonclient:vX.Y.Z'" \
              "with an optional '@sha256:<digest>'"
            exit 1
          fi
          BASE_IMAGE=${BASH_REMATCH[1]}
          SYN_VERSION=${BASH_REMATCH[2]}
          echo "Base image: $BASE_IMAGE"
          echo "synapseclient version: $SYN_VERSION"
          echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"
          echo "SYN_VERSION=$SYN_VERSION" >> "$GITHUB_ENV"

      - name: Check Python version matches base image
        run: |
          IMAGE_PY=$(docker run --rm --entrypoint python "$BASE_IMAGE" \
            -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "Base image Python: $IMAGE_PY, CI Python: $PYTHON_VERSION"
          if [ "$IMAGE_PY" != "$PYTHON_VERSION" ]; then
            echo "::error::CI PYTHON_VERSION ($PYTHON_VERSION) does not" \
              "match the base image Python ($IMAGE_PY). Update" \
              "PYTHON_VERSION in ci.yml."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          # SYN_VERSION comes from the "Read base image" step
          python -m pip install --upgrade pip
          pip install "synapseclient[curator]==${SYN_VERSION}"
          pip install -r requirements.txt

      - name: Run Tests
        env:
          SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
        run: |
          python -m pytest tests -v


  test-docker:
    name: Docker Tests
    runs-on: ubuntu-latest

    # Run a local registry to push to
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000

    env:
      TEST_TAG: localhost:5001/actions/container-action:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Build the Container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.TEST_TAG }}

      - name: Run the Container
        id: run
        env:
          ORG_NAME: dpetest
          SCHEMA_DIR: /schema_dir
          FIX_SCHEMA_NAME: "true"
        run: |
          docker run \
            -v $(pwd)/tests/schema_dir:/schema_dir \
            --env ORG_NAME="${{ env.ORG_NAME }}" \
            --env SCHEMA_DIR="${{ env.SCHEMA_DIR }}" \
            --env FIX_SCHEMA_NAME="${{ env.FIX_SCHEMA_NAME }}" \
            --env SYNAPSE_AUTH_TOKEN="${{ secrets.SYNAPSE_AUTH_TOKEN }}" \
            --rm ${{ env.TEST_TAG }}

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test Local Action
        id: register
        uses: ./
        with:
          org-name: dpetest
          schema-dir: tests/schema_dir
          synapse-auth-token: ${{ secrets.SYNAPSE_AUTH_TOKEN }}


  test-workflow:
    name: GitHub Workflow Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate JSON Schemas
        id: generate
        uses: Sage-Bionetworks-Actions/generate-jsonschema@main
        with:
          data-model-source: ./tests/data_model.csv
          data-model-labels: "display_label"

      - name: Register JSON Schemas
        id: register
        uses: ./
        with:
          org-name: dpetest
          fix-schema-name: "true"
          schema-dir: ${{ steps.generate.outputs.schemas}}
          synapse-auth-token: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
