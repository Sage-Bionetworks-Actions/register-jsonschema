name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-docker:
    name: Docker Tests
    runs-on: ubuntu-latest

    # Run a local registry to push to
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000

    env:
      TEST_TAG: localhost:5001/actions/container-action:latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Docker BuildX
        id: setup-buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: network=host

      - name: Build the Container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TEST_TAG }}

      - name: Run the Container
        id: run
        env:
          ORG_NAME: dpetest
          VERSION: 1.0.0
          SCHEMA_DIR: schema_dir
        run: |
          docker run \
            - v tests/schema_dir:/schema_dir
            --env ORG_NAME="${{ env.ORG_NAME }}" \
            --env VERSION="${{ env.VERSION }}" \
            --env SCHEMA_DIR="${{ env.SCHEMA_DIR }}" \
            --env SYNAPSE_AUTH_TOKEN="${{ secrets.SYNAPSE_AUTH_TOKEN }}" \
            --rm ${{ env.TEST_TAG }}

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          org-name: dpetest
          schema-dir: tests/schema_dir
          synapse_auth_token: ${{ secrets.SYNAPSE_AUTH_TOKEN }}


